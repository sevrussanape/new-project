<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crave — Operations</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f7f5ef;--ink:#171714;--muted:#77746b;--line:#e5e1d7;--accent:#d95b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.top{padding:24px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#faf8f2}.brand{font:700 28px 'Playfair Display',serif}.brand span{color:var(--accent)}.back{padding:10px 15px;border:1px solid var(--line);border-radius:9px;background:#fff}.wrap{max-width:1250px;margin:auto;padding:50px 6%}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--accent)}h1{font:700 50px 'Playfair Display',serif;margin:8px 0 35px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}.stat,.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.stat small{color:var(--muted);display:block}.stat strong{font-size:30px;display:block;margin-top:7px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.refresh{background:var(--ink);color:#fff;border:0;padding:11px 16px;border-radius:9px}.orders{display:grid;gap:14px}.order{display:grid;grid-template-columns:1fr auto;gap:20px}.order-id{font-weight:700}.date{font-size:11px;color:var(--muted)}.customer{color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px}.items{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:13px}.items div{display:flex;justify-content:space-between;margin:5px 0}.right{text-align:right}.total{font-size:20px;font-weight:700;margin:12px 0}.status{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.empty{text-align:center;color:var(--muted);padding:50px}.error{color:#b33}@media(max-width:700px){.stats{grid-template-columns:1fr}.order{grid-template-columns:1fr}.right{text-align:left}h1{font-size:40px}}</style></head><body><header class="top"><div class="brand">crave<span>.</span></div><a class="back" href="index.html">← Storefront</a></header><main class="wrap"><span class="eyebrow">OPERATIONS CONSOLE</span><h1>Order overview</h1><section class="stats"><div class="stat"><small>Total orders</small><strong id="count">—</strong></div><div class="stat"><small>Revenue</small><strong id="revenue">₹—</strong></div><div class="stat"><small>Active orders</small><strong id="active">—</strong></div></section><div class="toolbar"><span class="eyebrow">LIVE ORDER FEED</span><button class="refresh" id="refresh">Refresh</button></div><section class="orders" id="orders"><p class="empty">Loading orders…</p></section></main><script>const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:3000':'/api';const statuses=['Pending','Preparing','Out for delivery','Delivered','Cancelled'];async function load(){const box=document.querySelector('#orders');try{const r=await fetch(API+'/orders');if(!r.ok)throw Error('HTTP '+r.status);const orders=await r.json();document.querySelector('#count').textContent=orders.length;document.querySelector('#revenue').textContent='₹'+orders.reduce((s,o)=>s+Number(o.total||0),0).toLocaleString('en-IN');document.querySelector('#active').textContent=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length;if(!orders.length){box.innerHTML='<p class="empty">No orders yet.</p>';return}box.innerHTML=orders.map(o=>`<article class="order"><div><div class="order-id">#${o.id} <span class="date">${new Date(o.date).toLocaleString()}</span></div><div class="customer"><strong>${o.customer.name}</strong><br>${o.customer.phone} · ${o.customer.email}<br>${o.customer.address}</div><div class="items">${o.items.map(i=>`<div><span>${i.qty} × ${i.name}</span><span>₹${(i.price*i.qty).toFixed(0)}</span></div>`).join('')}</div></div><div class="right"><select class="status" data-id="${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><div class="total">₹${Number(o.total).toFixed(0)}</div></div></article>`).join('');box.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{await fetch(API+'/orders/'+s.dataset.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});load()})}catch(e){box.innerHTML='<p class="empty error">Backend not connected. Run <b>npm start</b> and open http://localhost:3000</p>'}}document.querySelector('#refresh').onclick=load;load();</script></body></html>
